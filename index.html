<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Player ranking</title>
  </head>

  <body>
    <form id="form">
      <label for="name">Nombre:</label>

  </body>
